<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор комбинаций Флорики</title>
<style>
:root {
  --green: #45ec09;
  --green-dark: #249901;
  --cream: #f4faea;
  --ink: #1b2613;
  --line: #cfe0c2;
  --amber: #f5a524;
  --coral: #ff6f61;
  --blue: #0945ec;
}
* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
}
header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  background: #fff;
  border-bottom: 3px solid var(--line);
}
header h1 {
  margin: 0 auto 0 0;
  font-size: 1.15rem;
  font-weight: 900;
}
button, .file-btn {
  padding: 9px 16px;
  background: #e5eedb;
  color: var(--ink);
  border: 3px solid var(--line);
  border-radius: 14px;
  font-size: 0.95rem;
  font-weight: 800;
  cursor: pointer;
}
button.primary {
  background: var(--green);
  border-color: var(--green-dark);
}
button.small {
  padding: 4px 10px;
  font-size: 0.85rem;
  border-radius: 10px;
}
button.danger {
  background: #ffe4e0;
  border-color: #ffb8b0;
}
.file-btn input {
  display: none;
}
main {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  gap: 18px;
  padding: 18px;
  max-width: 1280px;
  margin: 0 auto;
}
#list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-self: start;
  position: sticky;
  top: 80px;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
}
.item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: #fff;
  border: 3px solid var(--line);
  border-radius: 14px;
  text-align: left;
  cursor: pointer;
}
.item.active {
  border-color: var(--green-dark);
  background: #effcea;
}
.item b {
  display: block;
  font-size: 0.95rem;
}
.item small {
  color: #5d6b55;
}
.dot {
  flex: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--green);
}
.dot.warn {
  background: var(--amber);
}
.dot.bad {
  background: var(--coral);
}
#form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
  background: #fff;
  border: 3px solid var(--line);
  border-radius: 20px;
}
.card h2 {
  margin: 0;
  font-size: 1.05rem;
}
label {
  font-size: 0.85rem;
  font-weight: 800;
  color: #4b633b;
}
input[type="text"], textarea, select {
  width: 100%;
  padding: 9px 12px;
  background: var(--cream);
  color: var(--ink);
  border: 3px solid var(--line);
  border-radius: 12px;
  font-size: 1rem;
  resize: vertical;
}
textarea:focus, input:focus, select:focus {
  outline: none;
  border-color: var(--green-dark);
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.row > * {
  flex: 1 1 160px;
}
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  min-height: 1.2em;
  font-size: 0.8rem;
  font-weight: 700;
  color: #6b7a62;
}
.meta .ok {
  color: #1d7a2a;
}
.meta .warn {
  color: #a86a00;
}
.meta .bad {
  color: #b33a2f;
}
.option {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr);
  gap: 10px;
  padding: 10px;
  border: 3px solid var(--line);
  border-radius: 14px;
}
.option.correct {
  border-color: var(--green-dark);
  background: #effcea;
}
.letter {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 38px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  font-weight: 900;
}
.reactions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
#problems {
  margin: 0;
  padding-left: 20px;
  font-size: 0.9rem;
  font-weight: 700;
}
#problems li.bad {
  color: #b33a2f;
}
#problems li.warn {
  color: #a86a00;
}
#problems li.ok {
  color: #1d7a2a;
  list-style: none;
  margin-left: -20px;
}
.tip {
  padding: 10px 14px;
  background: #fff8e1;
  border: 3px solid #f2d36b;
  border-radius: 14px;
  font-size: 0.9rem;
  font-weight: 700;
  line-height: 1.4;
}
@media (max-width: 900px) {
  main {
    grid-template-columns: 1fr;
  }
  #list {
    position: static;
    max-height: none;
    flex-direction: row;
    overflow-x: auto;
  }
  .reactions {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<header>
  <h1>Редактор комбинаций Флорики</h1>
  <label class="file-btn">Открыть combo.json<input type="file" id="file" accept=".json,application/json"></label>
  <button id="add">Новая комбинация</button>
  <button id="save" class="primary">Скачать combo.json</button>
</header>
<main>
  <div id="list"></div>
  <div id="form"></div>
</main>
<script>
const ITEMS = [
  ["apple", "Яблоко"], ["pear", "Груша"], ["dog", "Собака"], ["cat", "Кот"],
  ["clock", "Часы"], ["flashlight", "Фонарик"], ["fan", "Вентилятор"], ["camera", "Камера"]
];
const LIMITS = { hypothesis: 120, option: 70, reaction: 100, hint: 100, factTitle: 50, factText: 170 };
const TYPES = [
  ["correct", "верный"], ["wrong_possible", "неверный: говорит, что возможно"],
  ["wrong_impossible", "неверный: говорит, что невозможно"], ["close", "похожий на верный"]
];
const LETTERS = ["A", "B", "C", "D"];
const RU = ["А", "Б", "В", "Г"];
const STORE = "florika_editor_draft";

let combos = [];
let current = 0;

function el(tag, props, kids) {
  const node = document.createElement(tag);
  Object.keys(props || {}).forEach(key => {
    if (key === "class") node.className = props[key];
    else if (key === "text") node.textContent = props[key];
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), props[key]);
    else node.setAttribute(key, props[key]);
  });
  (kids || []).forEach(kid => node.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid));
  return node;
}

function blankCombo() {
  const reactions = {};
  ["true", "false"].forEach(v => LETTERS.forEach(l => { reactions[v + "_" + l] = ""; }));
  return {
    id: "apple_pear",
    title: "",
    hypothesis: "",
    verdict: true,
    options: LETTERS.map((l, i) => ({ id: l, text: "", correct: i === 0, type: i === 0 ? "correct" : "wrong_possible" })),
    reactions,
    hint: "",
    fact: { title: "", text: "", sources: [] }
  };
}

function normalize(combo) {
  const options = combo.options || [];
  const mapping = {};
  options.forEach((o, i) => { mapping[o.id] = LETTERS[i]; });
  const same = options.every((o, i) => o.id === LETTERS[i]);
  if (!same) {
    const next = {};
    Object.keys(combo.reactions || {}).forEach(key => {
      const parts = key.split("_");
      next[parts[0] + "_" + (mapping[parts[1]] || parts[1])] = combo.reactions[key];
    });
    options.forEach((o, i) => { o.id = LETTERS[i]; });
    combo.reactions = next;
  }
  combo.reactions = combo.reactions || {};
  ["true", "false"].forEach(v => LETTERS.forEach(l => {
    const key = v + "_" + l;
    if (typeof combo.reactions[key] === "object" && combo.reactions[key] !== null) return;
    if (combo.reactions[key] === undefined) combo.reactions[key] = "";
  }));
  combo.fact = combo.fact || { title: "", text: "", sources: [] };
  combo.fact.sources = combo.fact.sources || [];
  return combo;
}

function reactionText(value) {
  return typeof value === "string" ? value : (value && value.text) || "";
}

function setReaction(combo, key, text) {
  const old = combo.reactions[key];
  if (old && typeof old === "object") old.text = text;
  else combo.reactions[key] = text;
}

function wordsInfo(text) {
  const sentences = text.split(/[.!?…]+/).map(s => s.trim()).filter(Boolean);
  const long = [];
  let tooLong = 0;
  sentences.forEach(s => {
    const words = s.split(/\s+/).filter(Boolean);
    if (words.length > 13) tooLong++;
    words.forEach(w => {
      const clean = w.replace(/[^А-Яа-яЁёA-Za-z-]/g, "");
      if (clean.length >= 11 && long.indexOf(clean.toLowerCase()) === -1) long.push(clean.toLowerCase());
    });
  });
  return { tooLong, long };
}

function metaFor(text, limit) {
  const box = el("div", { class: "meta" });
  const len = text.length;
  const cls = len <= limit ? "ok" : (len <= limit * 1.3 ? "warn" : "bad");
  box.appendChild(el("span", { class: cls, text: len + " из " + limit + " знаков" }));
  const info = wordsInfo(text);
  if (info.tooLong) box.appendChild(el("span", { class: "warn", text: "Длинных предложений: " + info.tooLong }));
  if (info.long.length) box.appendChild(el("span", { class: "warn", text: "Сложные слова: " + info.long.slice(0, 4).join(", ") }));
  return box;
}

function field(labelText, value, limit, rows, onInput) {
  const area = el("textarea", { rows: String(rows) });
  area.value = value;
  const wrap = el("div", {}, [el("label", { text: labelText }), area]);
  let meta = metaFor(value, limit);
  wrap.appendChild(meta);
  area.addEventListener("input", () => {
    onInput(area.value);
    const fresh = metaFor(area.value, limit);
    wrap.replaceChild(fresh, meta);
    meta = fresh;
    persist();
    refreshList();
    refreshProblems();
  });
  return wrap;
}

function problems(combo) {
  const list = [];
  const correct = combo.options.filter(o => o.correct);
  if (correct.length !== 1) list.push(["bad", "Должен быть ровно один верный вариант, сейчас: " + correct.length]);
  combo.options.forEach((o, i) => {
    if (o.correct && o.type !== "correct") list.push(["warn", "Вариант " + RU[i] + " верный, но его тип не «верный»"]);
    if (!o.correct && o.type === "correct") list.push(["warn", "Вариант " + RU[i] + " не верный, но тип стоит «верный»"]);
    if (!o.text.trim()) list.push(["bad", "Вариант " + RU[i] + " пустой"]);
  });
  if (!combo.hypothesis.trim()) list.push(["bad", "Нет текста гипотезы"]);
  Object.keys(combo.reactions).forEach(key => {
    if (!reactionText(combo.reactions[key]).trim()) list.push(["bad", "Нет реакции: " + key]);
  });
  if (!combo.hint.trim()) list.push(["warn", "Нет подсказки"]);
  if (!combo.fact.text.trim()) list.push(["warn", "Нет текста факта"]);
  if (combo.hypothesis.length > LIMITS.hypothesis * 1.3) list.push(["warn", "Гипотеза длинновата для 3 класса"]);
  if (combo.fact.text.length > LIMITS.factText * 1.3) list.push(["warn", "Факт длинноват, его не будут читать"]);
  const dup = combos.filter(c => c !== combo && sortedId(c.id) === sortedId(combo.id));
  if (dup.length) list.push(["bad", "Такая пара колб уже есть в другой комбинации"]);
  return list;
}

function sortedId(id) {
  return String(id).split("_").sort().join("_");
}

function status(combo) {
  const list = problems(combo);
  if (list.some(p => p[0] === "bad")) return "bad";
  return list.length ? "warn" : "";
}

function persist() {
  try {
    localStorage.setItem(STORE, JSON.stringify(combos));
  } catch (e) {}
}

function refreshList() {
  const box = document.getElementById("list");
  box.innerHTML = "";
  combos.forEach((combo, i) => {
    const item = el("button", { class: "item" + (i === current ? " active" : "") }, [
      el("span", { class: "dot " + status(combo) }),
      el("span", {}, [el("b", { text: combo.title || "Без названия" }), el("small", { text: combo.id })])
    ]);
    item.addEventListener("click", () => { current = i; render(); });
    box.appendChild(item);
  });
}

function refreshProblems() {
  const box = document.getElementById("problems");
  if (!box || !combos[current]) return;
  box.innerHTML = "";
  const list = problems(combos[current]);
  if (!list.length) box.appendChild(el("li", { class: "ok", text: "Всё в порядке" }));
  list.forEach(p => box.appendChild(el("li", { class: p[0], text: p[1] })));
}

function swapOptions(combo, i, j) {
  if (j < 0 || j >= combo.options.length) return;
  const a = combo.options[i];
  const b = combo.options[j];
  [a.text, b.text] = [b.text, a.text];
  [a.correct, b.correct] = [b.correct, a.correct];
  [a.type, b.type] = [b.type, a.type];
  ["true", "false"].forEach(v => {
    const ka = v + "_" + LETTERS[i];
    const kb = v + "_" + LETTERS[j];
    const tmp = combo.reactions[ka];
    combo.reactions[ka] = combo.reactions[kb];
    combo.reactions[kb] = tmp;
  });
}

function pairSelect(combo) {
  const parts = String(combo.id).split("_");
  const make = (index) => {
    const select = el("select");
    ITEMS.forEach(item => select.appendChild(el("option", { value: item[0], text: item[1] })));
    if (!ITEMS.some(item => item[0] === parts[index])) select.appendChild(el("option", { value: parts[index] || "", text: parts[index] || "-" }));
    select.value = parts[index] || ITEMS[0][0];
    return select;
  };
  const first = make(0);
  const second = make(1);
  const update = () => {
    combo.id = sortedId(first.value + "_" + second.value);
    idLabel.textContent = "id: " + combo.id;
    persist();
    refreshList();
    refreshProblems();
  };
  const idLabel = el("small", { text: "id: " + combo.id });
  first.addEventListener("change", update);
  second.addEventListener("change", update);
  return el("div", {}, [el("label", { text: "Какие колбы смешиваются" }), el("div", { class: "row" }, [first, second]), idLabel]);
}

function render() {
  refreshList();
  const form = document.getElementById("form");
  form.innerHTML = "";
  const combo = combos[current];
  if (!combo) {
    form.appendChild(el("div", { class: "card" }, [el("h2", { text: "Откройте combo.json или создайте новую комбинацию" })]));
    return;
  }

  const head = el("div", { class: "card" }, [
    el("h2", { text: "Основное" }),
    pairSelect(combo),
    field("Название", combo.title, 40, 1, v => { combo.title = v; }),
    field("Гипотеза Мэйлии", combo.hypothesis, LIMITS.hypothesis, 3, v => { combo.hypothesis = v; })
  ]);
  const verdict = el("select");
  verdict.appendChild(el("option", { value: "true", text: "Возможно" }));
  verdict.appendChild(el("option", { value: "false", text: "Невозможно" }));
  verdict.value = String(combo.verdict);
  verdict.addEventListener("change", () => { combo.verdict = verdict.value === "true"; persist(); });
  head.appendChild(el("div", {}, [el("label", { text: "Правильный вердикт" }), verdict]));
  form.appendChild(head);

  const optionsCard = el("div", { class: "card" }, [el("h2", { text: "Варианты объяснения" })]);
  combo.options.forEach((option, i) => {
    const radio = el("input", { type: "radio", name: "correct" });
    radio.checked = option.correct;
    radio.addEventListener("change", () => {
      combo.options.forEach((o, k) => {
        o.correct = k === i;
        o.type = k === i ? "correct" : (o.type === "correct" ? "wrong_possible" : o.type);
      });
      persist();
      render();
    });
    const type = el("select");
    TYPES.forEach(t => type.appendChild(el("option", { value: t[0], text: t[1] })));
    type.value = option.type;
    type.addEventListener("change", () => { option.type = type.value; persist(); refreshProblems(); });
    const controls = el("div", { class: "row" }, [
      el("label", {}, [radio, " это верный ответ"]),
      type,
      el("button", { class: "small", text: "Выше", onclick: () => { swapOptions(combo, i, i - 1); persist(); render(); } }),
      el("button", { class: "small", text: "Ниже", onclick: () => { swapOptions(combo, i, i + 1); persist(); render(); } })
    ]);
    optionsCard.appendChild(el("div", { class: "option" + (option.correct ? " correct" : "") }, [
      el("div", { class: "letter", text: RU[i] }),
      el("div", {}, [field("Текст варианта", option.text, LIMITS.option, 2, v => { option.text = v; }), controls])
    ]));
  });
  form.appendChild(optionsCard);

  const reactionsCard = el("div", { class: "card" }, [
    el("h2", { text: "Что говорит Флори" }),
    el("div", { class: "tip", text: "Если ребёнок выбрал нужный вердикт, но не тот вариант, Флори объясняет ошибку. Если вердикт неверный, она сначала говорит, как на самом деле. Пишите коротко: 1-2 предложения." })
  ]);
  const grid = el("div", { class: "reactions" });
  ["true", "false"].forEach(v => {
    LETTERS.forEach((l, i) => {
      const key = v + "_" + l;
      const name = "Выбрал «" + (v === "true" ? "Возможно" : "Невозможно") + "» и вариант " + RU[i];
      grid.appendChild(field(name, reactionText(combo.reactions[key]), LIMITS.reaction, 3, text => setReaction(combo, key, text)));
    });
  });
  reactionsCard.appendChild(grid);
  form.appendChild(reactionsCard);

  const factCard = el("div", { class: "card" }, [
    el("h2", { text: "Подсказка и интересный факт" }),
    field("Подсказка", combo.hint, LIMITS.hint, 2, v => { combo.hint = v; }),
    field("Заголовок факта (лучше вопросом)", combo.fact.title, LIMITS.factTitle, 1, v => { combo.fact.title = v; }),
    field("Текст факта", combo.fact.text, LIMITS.factText, 4, v => { combo.fact.text = v; })
  ]);
  const sources = el("textarea", { rows: "2" });
  sources.value = (combo.fact.sources || []).join("\n");
  sources.addEventListener("input", () => {
    combo.fact.sources = sources.value.split("\n").map(s => s.trim()).filter(Boolean);
    persist();
  });
  factCard.appendChild(el("div", {}, [el("label", { text: "Источники (каждая ссылка с новой строки)" }), sources]));
  const image = el("input", { type: "text", placeholder: "assets/facts/apple_clock.webp (необязательно)" });
  image.value = combo.fact.image || "";
  image.addEventListener("input", () => {
    if (image.value.trim()) combo.fact.image = image.value.trim();
    else delete combo.fact.image;
    persist();
  });
  factCard.appendChild(el("div", {}, [el("label", { text: "Картинка факта" }), image]));
  form.appendChild(factCard);

  const check = el("div", { class: "card" }, [el("h2", { text: "Проверка" }), el("ul", { id: "problems" })]);
  const actions = el("div", { class: "row" }, [
    el("button", { text: "Копировать эту комбинацию", onclick: () => {
      const copy = JSON.parse(JSON.stringify(combo));
      copy.title = (copy.title || "") + " (копия)";
      combos.splice(current + 1, 0, copy);
      current++;
      persist();
      render();
    } }),
    el("button", { class: "danger", text: "Удалить комбинацию", onclick: () => {
      if (!confirm("Удалить эту комбинацию?")) return;
      combos.splice(current, 1);
      current = Math.max(0, current - 1);
      persist();
      render();
    } })
  ]);
  check.appendChild(actions);
  form.appendChild(check);
  refreshProblems();
}

function load(list) {
  combos = list.map(normalize);
  current = 0;
  persist();
  render();
}

document.getElementById("file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      load(Array.isArray(data) ? data : data.combos);
    } catch (err) {
      alert("Не получилось прочитать файл. Проверьте, что это combo.json.");
    }
  };
  reader.readAsText(file, "utf-8");
});

document.getElementById("add").addEventListener("click", () => {
  combos.push(blankCombo());
  current = combos.length - 1;
  persist();
  render();
});

document.getElementById("save").addEventListener("click", () => {
  const bad = combos.filter(c => status(c) === "bad").length;
  if (bad && !confirm("В " + bad + " комбинациях есть ошибки. Всё равно скачать?")) return;
  const blob = new Blob([JSON.stringify(combos, null, 2)], { type: "application/json" });
  const link = el("a", { href: URL.createObjectURL(blob), download: "combo.json" });
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
});

(function start() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (Array.isArray(saved) && saved.length) {
      combos = saved.map(normalize);
    }
  } catch (e) {}
  render();
})();
</script>
</body>
</html>
